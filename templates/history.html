<!DOCTYPE html>
<html>
<head>

<title>Prediction History</title>

<style>

body{
font-family:Arial;
background:#e8f5e9;
}

table{
border-collapse:collapse;
width:90%;
margin:auto;
}

th,td{
border:1px solid black;
padding:8px;
text-align:center;
}

th{
background:green;
color:white;
}

h2{
text-align:center;
}

</style>

</head>

<body>

<h2>Prediction History</h2>

<table>

<tr>
<th>Place</th>
<th>N</th>
<th>P</th>
<th>K</th>
<th>Temperature</th>
<th>Humidity</th>
<th>pH</th>
<th>Rainfall</th>
<th>Crop</th>
</tr>

{% for row in records %}

<tr>
<td>{{row.Place}}</td>
<td>{{row.N}}</td>
<td>{{row.P}}</td>
<td>{{row.K}}</td>
<td>{{row.Temperature}}</td>
<td>{{row.Humidity}}</td>
<td>{{row.pH}}</td>
<td>{{row.Rainfall}}</td>
<td>{{row.Crop}}</td>
</tr>

{% endfor %}

</table>

<br>

<center>
<a href="/">Back</a>
</center>

</body>
</html>
